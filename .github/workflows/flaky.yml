name: Flaky Job
on:
  workflow_dispatch:
jobs:
  flaky_job:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt task with internal retries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          retry_on: error
          command: |
            echo "Forced failure for testing the retry ceiling"
            exit 1
