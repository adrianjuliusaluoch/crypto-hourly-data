name: Test Retry Behaviour

on:
  workflow_dispatch:  # manual trigger only, won't run on any schedule

jobs:
  test_retry:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command that fails twice, then succeeds
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          retry_on: error
          command: |
            COUNTER_FILE="/tmp/attempt_count.txt"
            if [ ! -f "$COUNTER_FILE" ]; then
              echo 0 > "$COUNTER_FILE"
            fi
            ATTEMPT=$(cat "$COUNTER_FILE")
            ATTEMPT=$((ATTEMPT + 1))
            echo $ATTEMPT > "$COUNTER_FILE"
            echo "This is attempt number $ATTEMPT"
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Simulating a failure"
              exit 1
            else
              echo "Succeeding now"
              exit 0
            fi
