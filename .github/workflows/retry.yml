name: Retry Flaky Job On Failure
on:
  workflow_run:
    workflows: ["Flaky Job"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry_on_failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRET_GITHUB_TOKEN }}
      MAX_RETRIES: 5
    steps:
      - name: Read current retry count
        id: count
        run: |
          CURRENT=$(gh variable get RETRY_COUNT --repo ${{ github.repository }} 2>/dev/null || echo 0)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Stop if ceiling reached
        if: ${{ steps.count.outputs.current >= env.MAX_RETRIES }}
        run: |
          echo "Retry ceiling of $MAX_RETRIES reached. Not retrying further."
          exit 0

      - name: Increment count and re-dispatch
        if: ${{ steps.count.outputs.current < env.MAX_RETRIES }}
        run: |
          NEXT=$(( ${{ steps.count.outputs.current }} + 1 ))
          gh variable set RETRY_COUNT --repo ${{ github.repository }} --body "$NEXT"
          echo "Retry attempt $NEXT of $MAX_RETRIES"
          gh workflow run "Flaky Job" \
            --repo ${{ github.repository }} \
            --ref ${{ github.event.workflow_run.head_branch }}

  reset_on_success:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRET_GITHUB_TOKEN }}
    steps:
      - name: Reset retry count
        run: gh variable set RETRY_COUNT --repo ${{ github.repository }} --body 0
