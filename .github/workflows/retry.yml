name: Retry Flaky Job On Failure
on:
  workflow_run:
    workflows: ["Flaky Job"]
    types: [completed]
jobs:
  retry_on_failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-dispatch the failed workflow
        env:
          GH_TOKEN: ${{ secrets.SECRET_GITHUB_TOKEN }}
        run: |
          gh workflow run "Flaky Job" \
            --repo ${{ github.repository }} \
            --ref ${{ github.event.workflow_run.head_branch }}
